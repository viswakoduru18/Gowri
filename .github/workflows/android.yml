name: Android build

# Builds the Gowri Android app on every push that touches app/, or on demand
# (Actions tab → Android build → Run workflow). Download the result from the
# run's "Artifacts" section.
#
# Play Store signing (optional): add repository secrets
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the APK is signed with a debug key: fine for testing on phones,
# not accepted by the Play Store.

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Backend URL baked into the app
        default: https://gowri-backend.onrender.com

env:
  API_BASE_URL: ${{ github.event.inputs.api_base_url || 'https://gowri-backend.onrender.com' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Set up Play Store signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      # Output goes to a file too; on failure the tail is posted as an annotation so the
      # cause shows on the run page (and via the API) without opening raw logs.
      - name: Build APK (install on phones)
        run: |
          set -o pipefail
          flutter build apk --release -v --dart-define=API_BASE_URL=$API_BASE_URL --build-number=${{ github.run_number }} 2>&1 | tee ../build.log

      - name: Build App Bundle (Play Store upload)
        run: |
          set -o pipefail
          flutter build appbundle --release --dart-define=API_BASE_URL=$API_BASE_URL --build-number=${{ github.run_number }} 2>&1 | tee ../build.log

      - name: Explain failure
        if: failure()
        working-directory: .
        run: |
          [ -f build.log ] || exit 0
          # Prefer Gradle's "What went wrong" section; otherwise the last lines.
          if grep -q "What went wrong" build.log; then
            sed -n '/What went wrong/,+25p' build.log > reason.txt
          else
            grep -v '^\s*$' build.log | tail -40 > reason.txt
          fi
          { echo '### Build failure'; echo '```'; cat reason.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          msg=$(sed -e 's/%/%25/g' reason.txt | head -c 3500 | awk '{printf "%s%%0A", $0}')
          echo "::error title=Android build failed::$msg"

      - uses: actions/upload-artifact@v5
        with:
          name: gowri-android-${{ github.run_number }}
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
